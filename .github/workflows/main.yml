name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project root
        id: root
        run: |
          set -e
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            DIR="."
          elif [ -f BandStatsAndroid/settings.gradle ]; then
            DIR="BandStatsAndroid"
          else
            FOUND="$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1 || true)"
            if [ -z "$FOUND" ]; then
              echo "No Android project found (missing settings.gradle)"
              echo "Repo layout:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi
            DIR="$(dirname "$FOUND")"
          fi
          echo "Using project root: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandStats-debug
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
